[workspace]
resolver = "2"

members = [
    "crates/lanshare-core",
    "crates/lanshare-net",
    "crates/lanshare-stream",
    "crates/lanshare-viewer",
    "crates/lanshare-host",
    "crates/lanshare-client",
    "crates/lanshare-app",
    "crates/lanshare-ffi",
]

# Dados que todos os crates vão herdar, para não repetir em cada um.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
lanshare-core = { path = "crates/lanshare-core" }
lanshare-net = { path = "crates/lanshare-net" }
lanshare-stream = { path = "crates/lanshare-stream" }
lanshare-viewer = { path = "crates/lanshare-viewer" }
lanshare-host = { path = "crates/lanshare-host" }
lanshare-client = { path = "crates/lanshare-client" }

# tokio: permite fazer várias coisas de rede ao mesmo tempo (assíncrono).
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "sync", "signal"] }

# serde e serde_json: transformam mensagens em JSON e de volta.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# lista as placas de rede e seus IPs.
if-addrs = "0.12"

# rpassword: lê a senha sem mostrar o que é digitado.
rpassword = "7"

# opus: comprime o som da transmissão (libopus, compilada junto; precisa do CMake no PATH).
opus = "0.4"